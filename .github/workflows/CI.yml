name: Compile MCA (manual)

# 手动编译：仅 workflow_dispatch 触发，push 不会自动编译。
#
# 为什么这样写：
#   - 本项目需要 ps2dev/ps2dev:v1.0 这套老 SDK 才能编译（新版 ps2sdk 已删除 IOP 的 sys/stat.h，
#     会连环报错）。
#   - 但 v1.0 容器的 musl 太老，跑不动 GitHub Actions 现在的 node24 运行时（之前 checkout 就崩）。
#   - 所以：job 跑在 ubuntu-latest（node 正常，能用 actions/checkout 与 upload-artifact），
#     只在里面用 docker 调用 v1.0 容器完成真正的编译。产物通过 upload-artifact 落到 Artifacts。
#
# 只编译两个通用版本（精简字体版）：
#   - mca_legacy: 使用主机自带 MCMAN（XOSD 模块），旧版系统/环境通用
#   - mca_new:    内置 homebrew mcman + exFAT USB 支持，新版环境通用
#   - Arcade/Prototype/Developer 等特殊记忆卡版本不再编译。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '程序内显示的版本号（默认 v2.2.0，与上游发布版一致）'
        required: false
        default: 'v2.2.0'
        type: string

permissions:
  contents: read   # 只上传 Artifacts，不需要写仓库

concurrency:
  group: mca-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set build timestamp
      run: echo "BUILD_TIMESTAMP=$(date -u '+%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

    - name: Compile (inside ps2dev/ps2dev:v1.0 via docker)
      run: |
        # 版本号：默认 v2.2.0（与上游发布版一致），可在手动触发时填写其他值。
        # 原版 CI 只有「打 tag 构建」才显示 v2.2.0，普通构建会显示 ref:<commit>。
        VERSION="${{ inputs.version || 'v2.2.0' }}"
        echo "程序内显示版本: $VERSION"
        docker run --rm \
          -e VERSION="$VERSION" \
          -v "$GITHUB_WORKSPACE":/work -w /work \
          ps2dev/ps2dev:v1.0 sh -c "
          git config --global --add safe.directory /work || true
          apk add --no-cache make git zip curl >/dev/null 2>&1 || true
          cd MCA && \
          make clean all packlang EE_BIN_DIR=../mca_legacy   VERSION=$VERSION MCMAN_TYPE=XOSD && \
          make clean all packlang EE_BIN_DIR=../mca_new      VERSION=$VERSION EXFAT=1
        "

    - name: Pack
      run: |
        zip -r "MemoryCardAnihilator_${{ env.BUILD_TIMESTAMP }}.zip" \
          ./mca_legacy/* ./mca_new/* README.MD LICENSE

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MCA
        path: MemoryCardAnihilator_${{ env.BUILD_TIMESTAMP }}.zip
